schema_version: 1
project: "Research in SoR: web and knowledge presence (SCQ B)"
driver: rufus
participants:
  rufus: Rufus
active_tree: future_reality
trees:
  goal:
    nodes:
      - id: g1
        kind: goal
        text: >-
          Research has a home in Seeds of Renaissance (SoR). People coming to SoR who
          want to explore, learn and share with others, all the way up to real
          research, find a clear way in; the people running the group have a working
          base to find, organise, coordinate and plan; and the group presents its work
          to the wider world in its own right while staying connected to SoR.
        label: "Research has a home in SoR: a clear way in, a working base, and its own public face"
        status: accepted
        accepted_by: [rufus]
        contributions:
          - {by: rufus, attribution: explicit, mode: text}
          - {by: assistant, attribution: assistant, mode: text}
      - id: csf1
        kind: critical_success_factor
        text: >-
          Way in (core): a visitor coming through SoR quickly sees what research
          offers, what is next (call, event) and how to get involved, whether on the
          SoR site or one step from it.
        label: "Way in: SoR visitors quickly see what research offers, what's next and how to join"
        status: accepted
        accepted_by: [rufus]
        contributions:
          - {by: assistant, attribution: assistant, mode: text}
          - {by: rufus, attribution: explicit, mode: text}
      - id: csf2
        kind: critical_success_factor
        text: >-
          Working base (core): stewards and active members can find information,
          organise, coordinate, and plan and work (documents, Beads tasks and similar)
          in one place.
        label: "Working base: stewards and active members find, organise, coordinate and plan in one place"
        status: accepted
        accepted_by: [rufus]
        contributions:
          - {by: assistant, attribution: assistant, mode: text}
          - {by: rufus, attribution: explicit, mode: text}
      - id: csf3
        kind: critical_success_factor
        text: >-
          Reference (secondary): active members and returning readers can find
          background documents, past work and history.
        label: "Reference (secondary): background docs, past work and history are findable"
        status: accepted
        accepted_by: [rufus]
        contributions:
          - {by: assistant, attribution: assistant, mode: text}
          - {by: rufus, attribution: explicit, mode: text}
      - id: csf4
        kind: critical_success_factor
        text: >-
          Own public face: the group's work reaches a wider audience in its own right;
          the group runs semi-autonomously but stays visibly part of SoR.
        label: "Own public face: work reaches a wider audience; semi-autonomous but visibly part of SoR"
        status: accepted
        accepted_by: [rufus]
        contributions:
          - {by: assistant, attribution: assistant, mode: text}
          - {by: rufus, attribution: explicit, mode: text}
      - id: csf5
        kind: critical_success_factor
        text: >-
          Clear jobs: each research site, repo and channel has one written job, there
          are no duplicate homes, and each stays current with little effort.
        label: "Clear jobs: one written job per site/repo/channel, no duplicates, kept current cheaply"
        status: accepted
        accepted_by: [rufus]
        contributions:
          - {by: assistant, attribution: assistant, mode: text}
          - {by: rufus, attribution: explicit, mode: text}
      - id: nc1_1
        kind: necessary_condition
        text: >-
          Research home location set: a section of the SoR site or a subsite. Same node as purpose-LTP W1 (pt5).
        label: "Research home location set: SoR section or subsite (= W1)"
        status: accepted
        accepted_by: [rufus]
        contributions:
          - {by: assistant, attribution: assistant, mode: text}
      - id: nc1_2
        kind: necessary_condition
        text: >-
          The SoR Join page and footer lead to research with need-led copy.
        label: "SoR Join page and footer lead to research with need-led copy"
        status: accepted
        accepted_by: [rufus]
        contributions:
          - {by: assistant, attribution: assistant, mode: text}
      - id: nc1_3
        kind: necessary_condition
        text: >-
          What research offers and its next call or event are visible and current (for example, a Luma feed).
        label: "Research's offer and next call or event are visible and current"
        status: accepted
        accepted_by: [rufus]
        contributions:
          - {by: assistant, attribution: assistant, mode: text}
      - id: nc1_4
        kind: necessary_condition
        text: >-
          Clear paths lead from the SoR funnel to a joinable first rung of the research ladder. Same node as purpose-LTP F1 (pt6); the rung itself is defined in SCQ A.
        label: "Clear paths lead from the SoR funnel to a joinable first rung (= F1)"
        status: accepted
        accepted_by: [rufus]
        contributions:
          - {by: assistant, attribution: assistant, mode: text}
      - id: nc2_1
        kind: necessary_condition
        text: >-
          One public working repo (life-itself/research) holds the charter, history, LTPs, plans and Beads tasks.
        label: "One public working repo (life-itself/research) holds docs, plans and Beads tasks"
        status: accepted
        accepted_by: [rufus]
        contributions:
          - {by: assistant, attribution: assistant, mode: text}
      - id: nc2_2
        kind: necessary_condition
        text: >-
          Stewards who don't use git can read and update the working base (for example, through agents).
        label: "Stewards who don't use git can read and update the working base"
        status: accepted
        accepted_by: [rufus]
        contributions:
          - {by: assistant, attribution: assistant, mode: text}
      - id: nc2_3
        kind: necessary_condition
        text: >-
          Private material, such as notes on members, stays out of the public repo, in sor-community.
        label: "Private material stays out of the public repo, in sor-community"
        status: accepted
        accepted_by: [rufus]
        contributions:
          - {by: assistant, attribution: assistant, mode: text}
      - id: nc3_1
        kind: necessary_condition
        text: >-
          The back catalogue has one canonical home; research.lifeitself.org and lifeitself.org/research redirect or point to it. Same node as purpose-LTP A1 (pt15).
        label: "Back catalogue has one canonical home; old research sites redirect to it (= A1)"
        status: accepted
        accepted_by: [rufus]
        contributions:
          - {by: assistant, attribution: assistant, mode: text}
      - id: nc3_2
        kind: necessary_condition
        text: >-
          Reference material is findable from the research home, as published pages or a linked repo.
        label: "Reference material is findable from the research home"
        status: accepted
        accepted_by: [rufus]
        contributions:
          - {by: assistant, attribution: assistant, mode: text}
      - id: nc4_1
        kind: necessary_condition
        text: >-
          The front-of-house channel is chosen. Same node as purpose-LTP D1 (pt2); an input, not reopened here.
        label: "Front-of-house channel chosen (= D1, input)"
        status: accepted
        accepted_by: [rufus]
        contributions:
          - {by: assistant, attribution: assistant, mode: text}
      - id: nc4_2
        kind: necessary_condition
        text: >-
          The public face and the SoR site link to each other, and the public face is visibly part of SoR.
        label: "Public face and SoR site link to each other; the face is visibly SoR"
        status: accepted
        accepted_by: [rufus]
        contributions:
          - {by: assistant, attribution: assistant, mode: text}
      - id: nc5_1
        kind: necessary_condition
        text: >-
          A published channel map covers the research sites, repos and channels, giving each one job and a named owner. Extends purpose-LTP D3 (pt4).
        label: "Published channel map gives each site, repo and channel one job and an owner (= D3+)"
        status: accepted
        accepted_by: [rufus]
        contributions:
          - {by: assistant, attribution: assistant, mode: text}
      - id: nc5_2
        kind: necessary_condition
        text: >-
          New outputs and events reach the research home by feed or a simple SOP (related to purpose-LTP C1).
        label: "New outputs and events reach the home by feed or simple SOP"
        status: accepted
        accepted_by: [rufus]
        contributions:
          - {by: assistant, attribution: assistant, mode: text}
      - id: nc5_3
        kind: necessary_condition
        text: >-
          Rufus and agents can edit every research site as markdown, with no paid development.
        label: "Every site is editable as markdown by Rufus and agents; no paid development"
        status: accepted
        accepted_by: [rufus]
        contributions:
          - {by: assistant, attribution: assistant, mode: text}
