      - ref: nc4_1
        work: "The SoR site decided (https://github.com/life-itself/sor-website/blob/main/docs/project.md (private repo), 23 Oct) that blog posts are written on the SoR site first and Substack carries only occasional big pieces. This may bear on D1; raise it in the purpose LTP."
        label: "SoR blog-first decision may bear on D1"
      - ref: nc2_2
        work: "Key assumption to test: can stewards who do not use git work with a git-based base through agents, or do they need another surface?"
        label: "Test: can non-git stewards use a git-based base?"
      - ref: csf1
        work: "Reuse purpose-LTP F1 (pt6) and part of W1 (pt5). Accepted 2026-10-23."
        label: "Reuses purpose-LTP F1 (pt6) and part of W1 (pt5)"
      - ref: csf3
        work: "Reuse purpose-LTP A1 (pt15). Accepted 2026-10-23."
        label: "Reuses purpose-LTP A1 (pt15)"
      - ref: csf4
        work: "Connected to the purpose LTP: depends on fr1 (front of house / back of house, accepted) and D1 (front-of-house channel, pt2, open). Strategy decisions stay in the purpose LTP; this tree only covers where the public face lives (Rufus, 2026-10-23)."
        label: "Depends on purpose-LTP fr1 and open D1; only covers where the public face lives"
      - ref: csf5
