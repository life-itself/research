        accepted_by: [rufus]
        addresses: [csf1]
        contributions:
          - {by: assistant, attribution: assistant, mode: text}
      - id: ude9
        kind: undesirable_effect
        text: Members disagree on what to prioritise (outputs vs conversation), which splits effort.
        label: Members disagree on priorities (outputs vs conversation), which splits effort
        status: accepted
        accepted_by: [rufus]
        addresses: [csf1, csf3]
        contributions:
          - {by: assistant, attribution: assistant, mode: text}
          - {by: bob, attribution: explicit, mode: voice}
      - id: ude10
        kind: undesirable_effect
        text: The group doesn't grow beyond the 8-15 regulars as much as it could.
        label: The group doesn't grow beyond the 8-15 regulars as much as it could
        status: accepted
        accepted_by: [rufus]
        addresses: [csf4]
        contributions:
          - {by: rufus, attribution: explicit, mode: text}
      - id: ude11
        kind: undesirable_effect
        text: The forum doesn't accumulate discussion or draw many new people.
        label: The forum doesn't accumulate discussion or draw many new people
        status: accepted
        accepted_by: [rufus]
        addresses: [csf2, csf4]
        contributions:
          - {by: rufus, attribution: explicit, mode: text}
      - id: ude12
        kind: undesirable_effect
        text: >-
          We aren't getting as many high-quality participants as we'd like, on the
          forum or in Friday meetings. Numbers are growing, but slowly, and it's not
          clear why.
        label: Too few high-quality participants on the forum or in Friday meetings; growth is slow
        status: accepted
        accepted_by: [rufus]
        addresses: [csf4]
        contributions:
          - {by: rufus, attribution: explicit, mode: text}
      - id: c1
        kind: cause
        text: >-
          Operations are poor and full of friction, e.g. no automatic calendar invites,
          and it's hard to get recordings onto YouTube.
        label: Operations are poor and full of friction (no auto calendar invites; recordings hard to post)
        status: accepted
        accepted_by: [rufus]
        contributions:
          - {by: rufus, attribution: explicit, mode: text}
      - id: c2
        kind: cause
        text: >-
          The forum platform is so-so and has some complexities, and the move to Forum
          Magnum hasn't happened yet.
        label: The forum platform is so-so and complex; the move to Forum Magnum hasn't happened
        status: accepted
        accepted_by: [rufus]
        contributions:
          - {by: rufus, attribution: explicit, mode: text}
      - id: rc1
        kind: cause
        text: >-
          Too little medium-form, high-quality posting (blog or LessWrong-level posts).
          Effort goes either to live "jazz cafe" talk or to rare full papers, with
          little in between.
        label: Too little medium-form, high-quality posting; effort is live talk or rare full papers
        status: accepted
        accepted_by: [rufus]
        contributions:
          - {by: rufus, attribution: explicit, mode: voice}
      - id: rc2
        kind: cause
        text: >-
          No active distribution. No one's role is to clip and repost good material
          (WhatsApp nudges, Substack Notes or Twitter, commenting on other blogs), so we
          rely on platforms alone to spread it.
        label: No active distribution; no one clips and reposts good material, so we rely on platforms
        status: accepted
        accepted_by: [rufus]
        contributions:
          - {by: rufus, attribution: explicit, mode: voice}
      - id: rc3
        kind: cause
        text: >-
          The forum can't surface quality. There's no voting, threads derail within about
          five replies, and the only control is banning.
        label: "The forum can't surface quality: no voting, threads derail, only control is banning"
        status: accepted
        accepted_by: [rufus]
        contributions:
          - {by: rufus, attribution: explicit, mode: voice}
      - id: rc4
        kind: cause
        text: >-
          Channel focus is unclear across forum, Substack and YouTube; "where does stuff
          go?" has no answer, so energy is spread thin.
        label: Channel focus is unclear across forum, Substack and YouTube; energy is spread thin
        status: accepted
        accepted_by: [rufus]
        contributions:
          - {by: rufus, attribution: explicit, mode: voice}
          - {by: bob, attribution: explicit, mode: voice}
      - id: c3
        kind: cause
        text: "Few growing contributors who can help with outputs (editing, harvesting, clipping)."
