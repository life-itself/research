        status: accepted
        accepted_by: [rufus]
        contributions:
          - {by: rufus, attribution: explicit, mode: voice}
      - id: fw1
        kind: observation
        text: >-
          The intended growth flywheel. Good medium-form posts travel, through platform
          reach plus active distribution. Newcomers arrive, lurk and comment. Good
          commenters rise into view through voting and threading. Some of them start
          posting their own work, which produces more good posts.
        label: "Intended flywheel: good posts travel, newcomers comment, good commenters rise and post"
        status: accepted
        accepted_by: [rufus]
        contributions:
          - {by: rufus, attribution: explicit, mode: voice}
      - id: ude13
        kind: undesirable_effect
        text: "We don't systematically learn from or track how things are going (no throughput measures, no review loop)."
        label: "We don't systematically learn from or track how things are going (no measures, no review loop)"
        status: accepted
        accepted_by: [rufus]
        contributions:
          - {by: rufus, attribution: explicit, mode: voice}
