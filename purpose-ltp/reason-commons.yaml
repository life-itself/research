  future_reality:
    nodes:
      - id: fr1
        kind: injection
        text: >-
          Front of house / back of house. One primary public channel gets most of our
          posting energy; only a small editor group posts there, and comments are
          moderated. The forum stays an informal back room for jamming and drafts. Good
          material is harvested from the back room and the Friday calls into the front.
          Which channel is the front of house (Substack or a renewed forum) is chosen later.
        label: "Front of house / back of house: one moderated public channel, the forum as informal back room"
        status: accepted
        accepted_by: [rufus]
        addresses: [rc4]
        derived_from: [cc4, cc5]
        contributions:
          - {by: rufus, attribution: explicit, mode: voice}
          - {by: bob, attribution: explicit, mode: voice}
          - {by: assistant, attribution: assistant, mode: text}
      - id: fr2
        kind: injection
        text: >-
          An outputs crew: a small group of volunteers running simple SOPs (write up a
          call, turn a thread into a post, edit, publish, clip and repost) so that output
          work no longer depends on the core group's hours, and regulars get a ladder
          from attending to contributing. Because dialogue only sometimes feeds outputs,
          the crew supports both harvested posts and original medium-form posts by
          members.
        label: "Outputs crew: volunteers running simple SOPs for writing up, editing, publishing, clipping"
        status: accepted
        accepted_by: [rufus]
        addresses: [c3, c4, ude7]
        derived_from: [cc9, cc10]
        contributions:
          - {by: rufus, attribution: explicit, mode: voice}
          - {by: assistant, attribution: assistant, mode: text}
      - id: fr3
        kind: injection
        text: "Hybrid crew. Combine some money with volunteers on a low-bono basis. A small paid coordinator recruits and runs the volunteers using the SOPs. Volunteers are also rewarded with recognition: bylines, the Fellow title and visibility on the front of house."
        label: "Hybrid crew: a small paid coordinator runs low-bono volunteers, rewarded with recognition"
        status: accepted
        accepted_by: [rufus]
        addresses: [cc11, ude8]
        derived_from: [cc14, cc15]
        contributions:
          - {by: rufus, attribution: explicit, mode: voice}
          - {by: assistant, attribution: assistant, mode: text}
      - id: fr4
        kind: injection
        text: "Raise funding for the research group, probably $5–10k, enough to fund a coordinator and low-bono stipends."
        label: "Raise funding for the research group (probably $5–10k) for a coordinator and stipends"
        status: accepted
        accepted_by: [rufus]
        addresses: [ude8]
        contributions:
          - {by: rufus, attribution: explicit, mode: voice}
      - id: fr5
        kind: injection
        text: "A ladder: a wide-open funnel with progressive filtering. Anyone can read and comment; upvotes and contributions make people visible; Fellows are selected from those who rise and commit to outputs; at the top is the right to publish on the front-of-house channel (e.g. 'you can publish on our Substack')."
        label: "A ladder: open funnel, progressive filtering, Fellows, then the right to publish front of house"
        status: accepted
        accepted_by: [rufus]
        addresses: [ude10, ude12, ude7]
        derived_from: [cc19, cc20]
        contributions:
          - {by: rufus, attribution: explicit, mode: voice}
          - {by: assistant, attribution: assistant, mode: text}
      - id: fr6
        kind: injection
        text: "A living question map: a short issue tree of the second renaissance inquiry. People talk about and work on whatever they want, but on-map work is favoured when allocating funded time, attention and focus. After each Friday session the harvest (by the crew, possibly AI-assisted) checks what happened against the map and records any updates. The crew writes periodic syntheses, and the map is revised quarterly."
        label: "A living question map: free choice, but on-map work favoured; harvest checks and quarterly revision"
        status: accepted
        accepted_by: [rufus]
        addresses: [ude4]
        derived_from: [cc24, cc25]
        contributions:
          - {by: rufus, attribution: explicit, mode: voice}
          - {by: assistant, attribution: assistant, mode: text}
