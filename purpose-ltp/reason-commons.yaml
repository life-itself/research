schema_version: 1
project: Research group purpose
driver: rufus
participants:
  rufus: Rufus
  bob: Bob Bunge
  jonah: Jonah Wilberg
active_tree: current_reality
trees:
  goal:
    nodes:
      - id: g1
        kind: goal
        text: >-
          The research group clarifies the paradigm shift (what today's paradigm is,
          where it came from, what is emerging and how transitions happen) and seeds
          that clarity into the Seeds of Renaissance community and the wider culture.
        label: Clarify the paradigm shift and seed that clarity into SoR and the wider culture
        status: accepted
        accepted_by: [rufus, bob]
        contributions:
          - {by: rufus, attribution: explicit, mode: voice}
          - {by: bob, attribution: explicit, mode: voice}
          - {by: assistant, attribution: assistant, mode: text}
      - id: csf1
        kind: critical_success_factor
        text: >-
          Research outputs of sufficient quality, on the questions that matter for the
          inquiry, get finished. (Which outputs and what quality bar are still open.)
        label: Quality research outputs on the questions that matter get finished
        status: accepted
        accepted_by: [rufus]
        contributions:
          - {by: assistant, attribution: assistant, mode: text}
          - {by: rufus, attribution: explicit, mode: text}
      - id: csf5
        kind: critical_success_factor
        text: Finished research outputs are published regularly.
        label: Finished outputs are published regularly
        status: accepted
        accepted_by: [rufus]
        contributions:
          - {by: rufus, attribution: explicit, mode: text}
      - id: csf3
        kind: critical_success_factor
        text: >-
          The group practises the kind of collective sensemaking it describes: not
          purely rational, and joining doing and being.
        label: The group practises the collective sensemaking it describes
        status: accepted
        accepted_by: [rufus]
        contributions:
          - {by: rufus, attribution: explicit, mode: voice}
          - {by: bob, attribution: explicit, mode: voice}
      - id: csf2
        kind: critical_success_factor
        text: >-
          The group's ideas reach, and are taken up by, the Seeds of Renaissance
          community and a chosen first audience beyond it.
        label: Ideas reach and are taken up by SoR and a chosen first audience beyond it
        status: accepted
        accepted_by: [rufus]
        contributions:
          - {by: jonah, attribution: explicit, mode: voice}
          - {by: assistant, attribution: assistant, mode: text}
      - id: nc1
        kind: necessary_condition
        text: >-
          The first audience beyond the Seeds of Renaissance community (for example policy
          people, the general public or scholars) and the channels for reaching it are
          chosen.
        label: First audience beyond SoR, and its channels, are chosen
        status: accepted
        accepted_by: [rufus]
        contributions:
          - {by: jonah, attribution: explicit, mode: voice}
      - id: csf4
        kind: critical_success_factor
        text: >-
          There is a steady flow of committed contributors: a stable core who give time
          regularly, plus newcomers, with the Seeds of Renaissance community as the
          on-ramp.
        label: Steady flow of committed contributors, with SoR as the on-ramp
        status: accepted
        accepted_by: [rufus]
        contributions:
          - {by: assistant, attribution: assistant, mode: text}
          - {by: rufus, attribution: explicit, mode: text}
    links:
      - id: l1
        from: [csf1]
        to: g1
        relation: necessary_for
        status: accepted
        accepted_by: [rufus]
        contributions:
          - {by: assistant, attribution: assistant, mode: text}
      - id: l5
        from: [csf5]
        to: g1
        relation: necessary_for
        status: accepted
        accepted_by: [rufus]
        contributions:
          - {by: rufus, attribution: explicit, mode: text}
      - id: l3
        from: [csf3]
        to: g1
        relation: necessary_for
        status: accepted
        accepted_by: [rufus]
        contributions:
          - {by: assistant, attribution: assistant, mode: text}
      - id: l2
        from: [csf2]
        to: g1
        relation: necessary_for
        status: accepted
        accepted_by: [rufus]
        contributions:
          - {by: assistant, attribution: assistant, mode: text}
      - id: l6
        from: [nc1]
        to: csf2
        relation: necessary_for
        status: accepted
        accepted_by: [rufus]
        contributions:
          - {by: jonah, attribution: explicit, mode: voice}
      - id: l4
        from: [csf4]
        to: g1
        relation: necessary_for
        status: accepted
        accepted_by: [rufus]
        contributions:
          - {by: assistant, attribution: assistant, mode: text}
    backlog:
      - ref: g1
        work: >-
          Hold as a working bet and review at the quarterly reflection (option A as a
          stance). Options and debate in goal-options.md.
      - ref: csf1
        work: Say which kinds of output count and what quality bar applies.
      - ref: csf3
        work: >-
          Bob holds that collective cognition is itself the main output. Possible
          Evaporating Cloud against csf1/csf5 (outputs vs conversation); see
          goal-options.md.
      - ref: l3
        work: test_necessity
      - ref: l4
        work: test_necessity
      - ref: nc1
        work: Choose the first audience (policy, public, scholars, ...).
  current_reality:
    nodes:
      - id: ude1
        kind: undesirable_effect
        text: Few research outputs get finished; most work stays as talks and discussion.
        label: Few research outputs get finished; most work stays as talks and discussion
